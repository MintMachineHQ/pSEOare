name: Deploy to Cloudflare Pages

# Optional second publishing target. GitHub Pages keeps running from the daily cron;
# this one is manual so you control when the Cloudflare project gets a fresh build.
# Requires two repository secrets:
#   CF_API_TOKEN  - Cloudflare API token with "Cloudflare Pages: Edit"
#   CF_ACCOUNT_ID - Cloudflare account id
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Cloudflare Pages project name"
        required: true
        default: pseoare

permissions:
  contents: read

concurrency:
  group: pseo-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INDEXNOW_KEY: ${{ secrets.IndexNOW_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore scrape + manifest caches
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: pseo-cache-${{ github.run_id }}
          restore-keys: |
            pseo-cache-

      - name: Point the build at the Cloudflare domain
        run: |
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path("config.json")
          cfg = json.loads(path.read_text())
          project = "${{ inputs.project }}"
          # IndexNow can only validate its key at a domain root, which a *.pages.dev
          # project URL is. A custom domain keeps working too.
          cfg["domain"] = f"https://{project}.pages.dev"
          path.write_text(json.dumps(cfg, indent=2) + "\n")
          print("domain =", cfg["domain"])
          PY

      - name: Generate pages
        run: python generator.py

      - name: Publish to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy output --project-name="${{ inputs.project }}" --branch=main

      - name: Save caches for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: pseo-cache-cf-${{ github.run_id }}
