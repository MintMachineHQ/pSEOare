name: Build and deploy pSEO site

on:
  schedule:
    # 04:17 UTC daily - off the top of the hour, when GitHub's cron queue is emptiest.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max pages to generate in this run (blank = config default)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: pseo-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The corpus grows every run, so job time grows with it. It sat near 10 minutes
    # before the CoinGecko daily-limit latch and a rate-limit bump, and the cap has to
    # leave room for that growth instead of killing a build mid-publish.
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      GOOGLE_INDEXING_CREDENTIALS: ${{ secrets.GOOGLE_INDEXING_CREDENTIALS }}
      BING_WEBMASTER_KEY: ${{ secrets.BING_WEBMASTER_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore scrape + manifest caches
        uses: actions/cache/restore@v4
        with:
          path: cache
          # Rolling restore: every run picks up the most recent cache prefix, and
          # each run saves a fresh cache (below) for the next one.
          key: pseo-cache-${{ github.run_id }}
          restore-keys: |
            pseo-cache-

      - name: Clear stale unavailable markers
        # A marker written for a rate limit or a daily quota is permanent and would
        # retire a working endpoint for the life of the cache, so those are cleared
        # before the build retries them. Markers recording a permanent status are kept.
        run: python tools/prune_markers.py --apply

      - name: Generate pages
        run: |
          if [ -n "${{ inputs.limit }}" ]; then
            python generator.py --limit "${{ inputs.limit }}"
          else
            python generator.py
          fi

      - name: Sanity check output
        run: |
          test -f output/index.html
          test -f output/sitemap.xml
          test -f output/robots.txt
          test -f output/404.html
          pages=$(find output -name '*.html' | wc -l)
          echo "published pages: $pages"
          test "$pages" -gt 1
          python - <<'PY'
          import json, pathlib, sys
          cfg = json.loads(pathlib.Path("config.json").read_text())
          # Verification tokens are plain text served at the site root, not pages.
          # 404.html is an error document: it deliberately carries no JSON-LD, because
          # there is no content on the page to describe.
          skip = set((cfg.get("seo", {}).get("verification_files") or {}).keys()) | {"404.html"}
          broken = []
          for path in pathlib.Path("output").glob("*.html"):
              if path.name in skip:
                  continue
              text = path.read_text(encoding="utf-8")
              if "<h1" not in text or "application/ld+json" not in text:
                  broken.append(path.name)
          if broken:
              sys.exit(f"pages missing h1 or JSON-LD: {broken[:5]}")
          print(f"all pages have an h1 and JSON-LD ({len(skip)} verification files skipped)")
          PY

      - name: Save caches for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: pseo-cache-${{ github.run_id }}

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          # The generated corpus grows over time: keep previously published pages.
          keep_files: true
          commit_message: "pSEO auto-build ${{ github.run_number }}"
          user_name: "pseo-bot"
          user_email: "pseo-bot@users.noreply.github.com"

      - name: Submit today's URLs to Bing
        # IndexNow pings Bing too, but the Webmaster endpoint is the one Bing's own
        # crawler weights. Its allowance is only 100 URLs a day against a corpus in the
        # thousands, so the tool submits its quota itself rather than relying on someone
        # to remember. It runs after the publish step so every submitted URL is already
        # live rather than announced a few seconds early. A missing key or an exhausted
        # quota is not a build failure; the tool also exits cleanly when the day's
        # allowance is already spent, and continue-on-error is belt and braces.
        if: always()
        continue-on-error: true
        run: |
          if [ -z "${BING_WEBMASTER_KEY:-}" ]; then
            echo "BING_WEBMASTER_KEY not set; skipping Bing submission"
            exit 0
          fi
          mkdir -p /tmp/bingkey
          printf '%s' "$BING_WEBMASTER_KEY" > /tmp/bingkey/bing-webmaster-key
          BING_KEY_PATH=/tmp/bingkey/bing-webmaster-key python tools/bing_submit.py --submit
